          base64 --decode "$RUNNER_TEMP/aperture-source.b64" > "$RUNNER_TEMP/aperture-source.zip"
          python3 -m zipfile -e "$RUNNER_TEMP/aperture-source.zip" "$GITHUB_WORKSPACE/source"
          test -f "$GITHUB_WORKSPACE/source/aperture_arch_1.0/build.sh"
          echo "Source reconstructed successfully."

      - name: Build ISO with Arch Linux and archiso
        shell: bash
        run: |
          docker pull archlinux:latest
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE/source/aperture_arch_1.0:/work" \
            -w /work \
            archlinux:latest bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed archiso
              bash ./build.sh
            '

      - name: Normalize release filename and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/source/aperture_arch_1.0/out"
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$ISO"
          mv "$ISO" ApertureFacilityOS-1.0-x86_64.iso
          sha256sum ApertureFacilityOS-1.0-x86_64.iso > SHA256SUMS.txt
          ls -lh ApertureFacilityOS-1.0-x86_64.iso SHA256SUMS.txt
          cat SHA256SUMS.txt
          df -h

      - name: Upload finished ISO
        uses: actions/upload-artifact@v4
        with:
          name: ApertureFacilityOS-1.0-x86_64
          path: |
            source/aperture_arch_1.0/out/ApertureFacilityOS-1.0-x86_64.iso
            source/aperture_arch_1.0/out/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
