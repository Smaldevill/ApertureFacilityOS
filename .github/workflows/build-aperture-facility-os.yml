name: Build Aperture Facility OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Reconstruct Aperture Facility OS source
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/source"
          cat > "$RUNNER_TEMP/aperture-source.b64" <<'APERTURE_SOURCE_B64'
